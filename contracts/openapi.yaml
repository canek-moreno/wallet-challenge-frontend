openapi: 3.1.0
info:
  title: Wallet API
  version: 0.1.0
  description: |
    Contrato entre el frontend y el backend de la wallet.
    Mientras no exista el backend real, estos endpoints se implementan en app/api (API simulada).
    Los endpoints marcados con x-status: planned aún no tienen implementación en el mock.
servers:
  - url: /api
    description: Mismo origen (cliente y API simulada)
  - url: http://localhost:3000/api
    description: Desarrollo local

tags:
  - name: auth
    description: Autenticación y sesión
  - name: accounts
    description: Productos (débito, crédito, bóveda) y patrimonio
  - name: transactions
    description: Historial de movimientos
  - name: contacts
    description: Directorio de contactos
  - name: transfers
    description: Transferencias de dinero
  - name: statements
    description: Estados de cuenta
  - name: bill-payments
    description: Pago de servicios
  - name: notifications
    description: Notificaciones y contador para la campana

security:
  - sessionCookie: []

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión con correo electrónico o teléfono y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión creada. La cookie session se envía en Set-Cookie.
          headers:
            Set-Cookie:
              description: Cookie httpOnly con el identificador de sesión.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/me:
    get:
      tags: [auth]
      operationId: getSession
      summary: Datos del usuario de la sesión actual
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/passkey:
    post:
      tags: [auth]
      operationId: loginWithPasskey
      summary: Iniciar sesión con passkey (biometría del dispositivo)
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeyLoginRequest"
      responses:
        "200":
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Solicitar restablecimiento de contraseña
      x-status: planned
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Solicitud aceptada. No revela si el correo existe.
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión y borrar la cookie
      responses:
        "204":
          description: Sesión cerrada.
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Listar productos del usuario y su patrimonio total
      responses:
        "200":
          description: Lista de productos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /accounts/{accountId}/freeze:
    patch:
      tags: [accounts]
      operationId: setAccountFrozen
      summary: Apagar o encender un producto (congelar tarjeta)
      description: Congela únicamente el uso físico de la tarjeta. No afecta transferencias ni pagos digitales.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frozen]
              properties:
                frozen:
                  type: boolean
      responses:
        "200":
          description: Estado actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /accounts/{accountId}/receive:
    get:
      tags: [accounts]
      operationId: getReceiveData
      summary: Datos para recibir dinero (CLABE y payload del código QR)
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Datos de recepción.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveData"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      summary: Historial de movimientos con filtro por tipo
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [all, income, expense]
            default: all
        - name: accountId
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Cursor de paginación devuelto en nextCursor.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Movimientos ordenados del más reciente al más antiguo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      summary: Listar o buscar contactos
      parameters:
        - name: q
          in: query
          required: false
          description: Texto de búsqueda por nombre, alias, banco o cuenta.
          schema:
            type: string
            maxLength: 100
        - name: favorites
          in: query
          required: false
          description: Si es true, devuelve solo los contactos favoritos para el carrusel.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Contactos ordenados alfabéticamente por nombre.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [contacts]
      operationId: createContact
      summary: Crear un contacto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Contacto creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"

  /transfers:
    post:
      tags: [transfers]
      operationId: sendTransfer
      summary: Enviar dinero a una cuenta propia o a un contacto
      description: |
        Operación idempotente. Reenviar la misma Idempotency-Key devuelve la misma respuesta
        sin volver a debitar el monto.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Transferencia aceptada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          description: Saldo insuficiente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferError"
        "500":
          description: Error genérico. Incluye código de referencia para soporte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferError"
        "503":
          description: Error de red o servicio no disponible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferError"
        "504":
          description: Tiempo de espera agotado. El usuario debe revisar movimientos antes de reintentar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferError"

  /transfers/{transferId}:
    get:
      tags: [transfers]
      operationId: getTransferReceipt
      summary: Obtener el comprobante de una transferencia
      x-status: planned
      parameters:
        - name: transferId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comprobante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferReceipt"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /statements:
    get:
      tags: [statements]
      operationId: listStatements
      summary: Estados de cuenta por producto y periodo
      x-status: planned
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
        - name: month
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        "200":
          description: Estado de cuenta del periodo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /bill-payments:
    post:
      tags: [bill-payments]
      operationId: payBill
      summary: Pagar un servicio con número de referencia
      x-status: planned
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillPaymentRequest"
      responses:
        "200":
          description: Pago aceptado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferReceipt"
        "422":
          description: Saldo insuficiente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferError"

  /notifications/summary:
    get:
      tags: [notifications]
      operationId: getNotificationSummary
      summary: Contador de notificaciones no leídas para el badge de la campana
      x-status: planned
      responses:
        "200":
          description: Contador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSummary"
        "401":
          $ref: "#/components/responses/ErrorResponse"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Cookie httpOnly creada por POST /auth/login.

  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave única por intento de operación de dinero. Generada por el cliente.
      schema:
        type: string
        minLength: 8
        maxLength: 64

  responses:
    ErrorResponse:
      description: Error genérico de la API.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    Currency:
      type: string
      enum: [MXN, USD]

    Money:
      type: object
      required: [amountCents, currency]
      properties:
        amountCents:
          type: integer
          description: Monto en centavos para evitar errores de punto flotante.
          example: 125000
        currency:
          $ref: "#/components/schemas/Currency"

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Correo electrónico o teléfono con código de país (por ejemplo +525512345678).
        password:
          type: string
          minLength: 1
          format: password

    LoginResponse:
      type: object
      required: [name]
      properties:
        name:
          type: string

    SessionUser:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

    PasskeyLoginRequest:
      type: object
      required: [credentialId, assertion]
      properties:
        credentialId:
          type: string
        assertion:
          type: string
          description: Aserción WebAuthn firmada por el dispositivo.

    Account:
      type: object
      required: [id, type, last4, network, balanceCents, currency, frozen]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [debit, credit, vault]
        last4:
          type: string
          pattern: "^[0-9]{4}$"
          example: "4321"
        expiration:
          type: string
          pattern: "^(0[1-9]|1[0-2])/[0-9]{2}$"
          description: Fecha de vencimiento en formato MM/AA. Solo aplica a tarjetas.
          example: "08/29"
        network:
          type: string
          enum: [visa, mastercard]
        balanceCents:
          type: integer
        currency:
          $ref: "#/components/schemas/Currency"
        frozen:
          type: boolean
          description: Bloquea solo el uso físico de la tarjeta. Las transferencias y los pagos digitales siguen disponibles.

    AccountsResponse:
      type: object
      required: [netWorth, accounts]
      properties:
        netWorth:
          $ref: "#/components/schemas/Money"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    ReceiveData:
      type: object
      required: [clabe, qrPayload]
      properties:
        clabe:
          type: string
          pattern: "^[0-9]{18}$"
        qrPayload:
          type: string
          description: Contenido del código QR de recepción.

    Transaction:
      type: object
      required: [id, name, category, direction, amount, occurredAt]
      properties:
        id:
          type: string
        name:
          type: string
          example: "Starbucks Reforma"
        merchantLogoUrl:
          type: [string, "null"]
          format: uri
        category:
          type: string
          example: "Alimentos"
        direction:
          type: string
          enum: [income, expense]
        amount:
          $ref: "#/components/schemas/Money"
        occurredAt:
          type: string
          format: date-time

    TransactionsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        nextCursor:
          type: [string, "null"]

    Contact:
      type: object
      required: [id, fullName, bank, accountNumber, favorite]
      properties:
        id:
          type: string
        fullName:
          type: string
        bank:
          type: string
          example: "BBVA"
        accountNumber:
          type: string
          description: CLABE de 18 dígitos o IBAN, según el banco destino.
        alias:
          type: [string, "null"]
        favorite:
          type: boolean

    ContactsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Contact"

    CreateContactRequest:
      type: object
      required: [fullName, bank, accountNumber]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        bank:
          type: string
          minLength: 2
        accountNumber:
          type: string
          pattern: "^([0-9]{18}|[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30})$"
          description: CLABE (18 dígitos) o IBAN.
        alias:
          type: string
          maxLength: 60

    TransferRequest:
      type: object
      required: [sourceAccountId, destinationId, amountCents, currency]
      properties:
        sourceAccountId:
          type: string
        destinationId:
          type: string
          description: Id de una cuenta propia o de un contacto.
        amountCents:
          type: integer
          minimum: 1
        currency:
          $ref: "#/components/schemas/Currency"
        concept:
          type: string
          maxLength: 120
          description: Referencia o concepto opcional.

    TransferReceipt:
      type: object
      required: [id]
      properties:
        id:
          type: string
          example: "TRX-3f2a9c1e-8b7d-4c2a-9e1f-0a1b2c3d4e5f"
        status:
          type: string
          enum: [completed]
        amount:
          $ref: "#/components/schemas/Money"
        fee:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: string
          format: date-time

    BillPaymentRequest:
      type: object
      required: [sourceAccountId, serviceId, referenceNumber, amountCents, currency]
      properties:
        sourceAccountId:
          type: string
        serviceId:
          type: string
        referenceNumber:
          type: string
        amountCents:
          type: integer
          minimum: 1
        currency:
          $ref: "#/components/schemas/Currency"

    Statement:
      type: object
      required: [accountId, period, openingBalance, closingBalance, items]
      properties:
        accountId:
          type: string
        period:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
          example: "2026-10"
        openingBalance:
          $ref: "#/components/schemas/Money"
        closingBalance:
          $ref: "#/components/schemas/Money"
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"

    NotificationSummary:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer
          minimum: 0

    TransferErrorCode:
      type: string
      enum: [INSUFFICIENT_FUNDS, TIMEOUT, NETWORK, UNKNOWN]

    TransferError:
      type: object
      required: [code]
      properties:
        code:
          $ref: "#/components/schemas/TransferErrorCode"
        availableCents:
          type: integer
          description: Saldo disponible. Solo en INSUFFICIENT_FUNDS.
        currency:
          $ref: "#/components/schemas/Currency"
        reference:
          type: string
          description: Código de referencia para soporte. Solo en UNKNOWN.

    ApiError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [INVALID_CREDENTIALS, UNAUTHORIZED, NOT_FOUND, VALIDATION_ERROR, UNKNOWN]
        reference:
          type: string
